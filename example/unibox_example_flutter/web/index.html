<!DOCTYPE html>
<html>
<head>
  <!--
    The base href is replaced by `flutter build web --base-href`, which is how a
    build served from /unibox/flutter/ resolves its assets from any route below it.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Unibox site and the example it compares, drawn by Flutter from the same node trees the web renderer serves as HTML.">
  <!-- The page has no text of its own for a crawler to read, and it is framed by the
       site's index; the robots file disallows it as well. -->
  <meta name="robots" content="noindex">
  <title>Unibox — the site, drawn by Flutter</title>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
