name: unibox_example_flutter
description: Flutter host of the shared Unibox example card.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  unibox_core: ^0.1.0
  unibox_example_shared: ^0.1.0
  unibox_flutter: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  unibox_material: ^0.1.0

flutter:
  # One font, shipped by both hosts. A browser substitutes a face it does not have
  # and Skia substitutes the nearest one it does, so a weight only means the same
  # thing on the two renderings when they are given the same four files: this demo
  # ships 400, 500, 600 and 700 and the site declares the same ones.
  fonts:
    - family: UniboxText
      fonts:
        - asset: assets/fonts/roboto-400.ttf
          weight: 400
        - asset: assets/fonts/roboto-500.ttf
          weight: 500
        - asset: assets/fonts/roboto-600.ttf
          weight: 600
        - asset: assets/fonts/roboto-700.ttf
          weight: 700
