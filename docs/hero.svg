<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Unibox: one node tree, two renderers</title>
  <desc id="desc">On the left, one immutable Dart node tree. A fork leads to two panels: the same card drawn by Flutter's widget tree, and by Unibox's own HTML renderer. The two cards are identical, because one table of expected appearance holds both renderers to the same answer.</desc>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 44px; font-weight: 600; fill: #1D1B20; }
    .subtitle { font-size: 20px; fill: #49454F; }
    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 1.6px; fill: #49454F; }
    .node { font-size: 13px; fill: #21005D; }
    .node-strong { font-size: 16px; font-weight: 600; fill: #FFFFFF; }
    .renderer { font-size: 15px; font-weight: 600; fill: #6750A4; }
    .call { font-size: 12px; fill: #49454F; }
    .card-title { font-size: 15px; font-weight: 600; fill: #1D1B20; }
    .card-body { font-size: 12px; fill: #49454F; }
    .button { font-size: 12px; font-weight: 500; fill: #FFFFFF; }
    .note { font-size: 12px; fill: #49454F; }
    .footer { font-size: 12px; fill: #49454F; }
  </style>

  <rect width="1200" height="630" fill="#FEF7FF"/>

  <text class="title" x="64" y="96">Unibox</text>
  <text class="subtitle" x="64" y="132">One tree. Two renderers. One appearance.</text>
  <line x1="64" y1="162" x2="1136" y2="162" stroke="#CAC4D0" stroke-width="1" opacity="0.7"/>

  <!-- The tree -->
  <text class="eyebrow" x="64" y="202">ONE DART TREE</text>

  <rect x="64" y="216" width="180" height="46" rx="10" fill="#6750A4"/>
  <text class="node-strong" x="154" y="245" text-anchor="middle">Box</text>

  <rect x="116" y="286" width="150" height="40" rx="8" fill="#EADDFF"/>
  <text class="node" x="191" y="311" text-anchor="middle">TextNode</text>

  <rect x="116" y="352" width="150" height="40" rx="8" fill="#EADDFF"/>
  <text class="node" x="191" y="377" text-anchor="middle">Box</text>

  <rect x="164" y="420" width="150" height="38" rx="8" fill="#EADDFF"/>
  <text class="node" x="239" y="444" text-anchor="middle">TextNode</text>

  <rect x="164" y="474" width="150" height="38" rx="8" fill="#EADDFF"/>
  <text class="node" x="239" y="498" text-anchor="middle">Box · onTap</text>

  <path d="M88 262 V493 M88 306 H116 M88 372 H116 M140 392 V493 M140 439 H164 M140 493 H164"
        fill="none" stroke="#79747E" stroke-width="1.6"/>

  <text class="note" x="64" y="552">the description: layout, tokens, state, semantics</text>

  <!-- The fork -->
  <path d="M244 239 H470 V490" fill="none" stroke="#79747E" stroke-width="2"/>
  <path d="M470 280 H560" fill="none" stroke="#79747E" stroke-width="2"/>
  <path d="M470 490 H560" fill="none" stroke="#79747E" stroke-width="2"/>
  <path d="M566 280 l-12 -6 v12 z" fill="#79747E"/>
  <path d="M566 490 l-12 -6 v12 z" fill="#79747E"/>

  <!-- Flutter panel -->
  <rect x="580" y="190" width="556" height="180" rx="18" fill="#F7F2FA" stroke="#CAC4D0"/>
  <text class="renderer" x="604" y="222">Flutter</text>
  <text class="call" x="604" y="242">tree.toWidget() → Flutter widgets</text>

  <g filter="url(#cardShadow)">
    <rect x="748" y="228" width="364" height="124" rx="14" fill="#FFFFFF" stroke="#CAC4D0"/>
  </g>
  <text class="card-title" x="768" y="258">Order summary</text>
  <text class="card-body" x="768" y="280">Two nights, one room.</text>
  <rect x="768" y="294" width="104" height="32" rx="16" fill="#6750A4"/>
  <text class="button" x="820" y="315" text-anchor="middle">Confirm</text>

  <!-- HTML panel -->
  <rect x="580" y="400" width="556" height="180" rx="18" fill="#F7F2FA" stroke="#CAC4D0"/>
  <text class="renderer" x="604" y="432">HTML</text>
  <text class="call" x="604" y="452">tree.toComponent() → HTML + CSS</text>

  <g filter="url(#cardShadow)">
    <rect x="748" y="438" width="364" height="124" rx="14" fill="#FFFFFF" stroke="#CAC4D0"/>
  </g>
  <text class="card-title" x="768" y="468">Order summary</text>
  <text class="card-body" x="768" y="490">Two nights, one room.</text>
  <rect x="768" y="504" width="104" height="32" rx="16" fill="#6750A4"/>
  <text class="button" x="820" y="525" text-anchor="middle">Confirm</text>

  <text class="note" x="858" y="391" text-anchor="middle">the same appearance, from one contract</text>

  <text class="footer" x="64" y="600">pure Dart · no dependencies · both renderers held to one table of expected appearance</text>

  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1D1B20" flood-opacity="0.10"/>
    </filter>
  </defs>
</svg>
