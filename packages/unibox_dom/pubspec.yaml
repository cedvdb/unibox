name: unibox_dom
description: Renders Unibox node trees into DOM nodes in a browser, so one tree is a document, an application, and a page that becomes one. Builds the elements `unibox_html` wrote, from the same plan and the same classes.
publish_to: none
version: 0.1.0
repository: https://github.com/cedvdb/unibox
homepage: https://github.com/cedvdb/unibox
issue_tracker: https://github.com/cedvdb/unibox/issues
topics:
  - layout
  - ui
  - web
  - dom
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  unibox_core: ^0.1.0
  unibox_html: ^0.1.0
  web: ^1.1.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.8
  unibox_material: ^0.1.0
  unibox_testing: ^0.1.0
