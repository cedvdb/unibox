name: unibox_jaspr
description: Renders Unibox layout primitives as Jaspr components, with CSS typography inheritance and accessible roles.
publish_to: none
version: 0.1.0
repository: https://github.com/cedvdb/unibox
homepage: https://github.com/cedvdb/unibox
issue_tracker: https://github.com/cedvdb/unibox/issues
topics:
  - layout
  - ui
  - web
  - server-side-rendering
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  jaspr: ^0.24.0-beta.0
  unibox_core: ^0.1.0
  universal_web: ^1.1.0

dev_dependencies:
  jaspr_test: ^0.24.0-beta.0
  lints: ^6.1.0
  test: ^1.25.8
  unibox_css: ^0.1.0
  unibox_testing: ^0.1.0
