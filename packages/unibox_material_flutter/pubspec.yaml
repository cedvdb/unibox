name: unibox_material_flutter
description: Draws unibox_material's components with Flutter's own widgets, for an application that asks for it.
publish_to: none
version: 0.1.0
repository: https://github.com/cedvdb/unibox
homepage: https://github.com/cedvdb/unibox
issue_tracker: https://github.com/cedvdb/unibox/issues
topics:
  - material
  - widgets
  - design-system
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  # The Material library Flutter 3.50 ships as a package: `package:flutter/material.dart`
  # forwards to it and is deprecated, and the forwarder's types are not the package's.
  material_ui: ^1.11.1
  unibox_core: ^0.1.0
  unibox_flutter: ^0.1.0
  unibox_material: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
