name: unibox_flutter
description: Renders Unibox layout primitives as Flutter widgets, with inherited typography, interaction states and semantics.
publish_to: none
version: 0.1.0
repository: https://github.com/cedvdb/unibox
homepage: https://github.com/cedvdb/unibox
issue_tracker: https://github.com/cedvdb/unibox/issues
topics:
  - layout
  - ui
  - widget
  - cross-platform
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  # The Material library Flutter 3.50 ships as a package: `package:flutter/material.dart`
  # forwards to it and is deprecated, and the forwarder's types are not the package's.
  material_ui: ^1.11.1
  unibox_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  unibox_testing: ^0.1.0
