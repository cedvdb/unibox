name: Pages

# Publishes the example as a static site: the documents `unibox_html` writes and the Flutter build of
# the same node tree, with a landing page that shows them side by side.
#
# One-time setup, and the one step a workflow cannot do for you: Settings -> Pages ->
# Source: "GitHub Actions". Until that is on, this workflow still verifies the
# workspace and builds the site, keeps it as a downloadable artifact, and says in the
# run summary that the deploy was skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The address the site is served from. A project site lives under /<repo>/.
  SITE_URL: https://cedvdb.github.io/unibox/

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    # The same bound `ci.yml` gives its jobs, for the same reason: `tool/verify.sh` runs the browser
    # suite here too, and a suite that never reports would otherwise hold this queue for the six-hour
    # default — with `cancel-in-progress: false`, blocking every deploy behind it.
    timeout-minutes: 30
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the Flutter version
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - name: Verify the workspace
        run: tool/verify.sh
      - name: Build the pages
        run: tool/site.sh --base=/unibox/ --url="$SITE_URL"

      # The site is only worth publishing if the takeover page really becomes the application:
      # a document that serves and never boots passes every other check here.
      - name: Check that the document boots
        run: tool/boot_check.sh build/site

      # The other half, which the boot check cannot see: a client script that throws still serves, still
      # scores well in Lighthouse, and still passes every suite — because the suites start their own
      # browser instead of reading what this build produced.
      # The pages are still pages: headings are headings, and every file a document names is in the
      # build. A wrong relative path serves, scores and does nothing — no browser calls it an error.
      - name: Check that the documents still crawl
        run: python3 tool/doc_check.py build/site "$SITE_URL"

      - name: Check that the client answers a press
        run: tool/dom_check.sh build/site

      # The numbers, against the budgets — and against `tool/performance_baseline.json`, so a slow
      # drift that stays inside a budget is still named in the log.
      - name: Measure the pages against their budgets
        run: tool/performance.sh build/site

      # A workflow cannot enable Pages with the repository token: `configure-pages`
      # needs an administrator to have turned it on first. Detect that instead of
      # failing, so the build keeps its value and the run link explains the next step.
      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages is not enabled::Settings -> Pages -> Source: GitHub Actions, then re-run this workflow to publish. The site built successfully and is attached to this run."
          fi

      - name: Keep the site for inspection
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: build/site
          retention-days: 7

      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: build/site

  # The `github-pages` environment is the authority on which branches may publish: it holds the
  # list, an administrator keeps it current, and a branch that is not on it is refused by name.
  # Not repeated as a condition here — a workflow that guesses the list cannot know it was
  # extended, and a branch that was allowed to publish would silently stop doing so.
  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
