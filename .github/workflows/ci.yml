name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Flutter is read from `.flutter-version`, by the first step of every job: one file, so this
# workflow, the weekly gate, the site build and a local `tool/verify.sh` cannot disagree about
# the version they verify against — and so an assistant cannot spend an hour on a failure that
# is only its own SDK.

# Every job states a timeout, because the default is six hours — not a bound anybody chose. A browser
# suite that never reported held the test job for exactly that long, and since a new push cancels the
# run in progress the queue looked busy rather than stuck. A job that hangs now fails in minutes and
# names the step it hung in.
jobs:
  analyze:
    name: Format and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read the Flutter version
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze every package
        run: dart analyze
      - name: Check that the documentation points at files that exist
        run: python3 tool/check_docs.py
      - name: Check the gates themselves
        run: python3 tool/gate_tests.py

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Read the Flutter version
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      - name: unibox_core
        working-directory: packages/unibox_core
        run: dart test
      - name: unibox_testing
        working-directory: packages/unibox_testing
        run: dart test
      - name: unibox_material
        working-directory: packages/unibox_material
        run: dart test
      - name: unibox_css
        working-directory: packages/unibox_css
        run: dart test
      - name: unibox_element
        working-directory: packages/unibox_element
        run: dart test
      - name: unibox_html
        working-directory: packages/unibox_html
        run: dart test
      - name: unibox_dom
        working-directory: packages/unibox_dom
        run: dart test -p chrome
      - name: unibox_flutter
        working-directory: packages/unibox_flutter
        run: flutter test
      - name: example shared tree
        working-directory: example/unibox_example_shared
        run: dart test
      - name: example site host
        working-directory: example/unibox_example_html
        run: dart test
      - name: example Flutter host
        working-directory: example/unibox_example_flutter
        run: flutter test

  scale:
    name: Scale benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Read the Flutter version
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      # Pure Dart and a few seconds, so it is a job of its own rather than a step in the
      # test job: it measures the pipeline a node goes through — plan, stylesheet, text —
      # which Lighthouse cannot see, and it fails when a page with thousands of nodes stops
      # being linear. See PERFORMANCE.md.
      - name: Hold a big page to its baseline
        run: tool/scale.sh

  docs:
    name: API docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read the Flutter version
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      - name: Build the docs of every package
        run: |
          while read -r package; do
            log="$RUNNER_TEMP/$package.log"
            if ! (cd "packages/$package" && dart doc --output "$RUNNER_TEMP/docs/$package") >"$log" 2>&1; then
              cat "$log"
              exit 1
            fi
            cat "$log"
            if grep -q 'warning:' "$log"; then
              echo "dartdoc reported warnings in $package"
              exit 1
            fi
          done <<'PACKAGES'
          unibox_core
          unibox_testing
          unibox_material
          unibox_css
          unibox_element
          unibox_html
          unibox_dom
          unibox_flutter
          PACKAGES

  site:
    name: The site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Read the Flutter version
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: flutter pub get

      # The build comes first and every check reads what it produced, so a failure names the thing
      # that broke: a site that does not build is not a page that crawls badly.
      #
      # This is the sequence `pages.yml` runs before it publishes, in that order, and running it here
      # is the point: a change that would break the published site then fails on the pull request
      # that made it, instead of on `main` afterwards, where the only thing left to do is revert.
      # The three checks read the same build, so they cost seconds; the build itself was already
      # being paid for by the budget below.
      - name: Build the site
        run: tool/site.sh
      - name: Check that the document boots
        run: tool/boot_check.sh build/site
      - name: Check that the documents still crawl
        run: python3 tool/doc_check.py build/site
      - name: Check that the client answers a press
        run: tool/dom_check.sh build/site

      # Lighthouse starts a browser and takes a few minutes, which is why it is the last step of a job
      # of its own rather than part of the fast loop. A page outside its budget fails the build.
      #
      # It measures the *site*, not documents written into a temporary directory: the front page
      # embeds the takeover, so a documents-only build has a frame whose engine does not exist and
      # the application budget passes without measuring anything.
      - name: Measure the pages against their budgets
        run: tool/performance.sh build/site
