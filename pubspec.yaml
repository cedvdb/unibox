name: unibox
description: Pure Dart layout primitives that compile natively to Flutter widgets and Jaspr components.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

workspace:
  - packages/unibox_testing
  - packages/unibox_core
  - packages/unibox_flutter
  - packages/unibox_jaspr
  - packages/unibox_css
  - packages/unibox_material
  - example/unibox_example_shared
  - example/unibox_example_flutter
  - example/unibox_example_jaspr
