name: unibox
description: Pure Dart layout primitives that draw as Flutter widgets and render as HTML a crawler can read.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

workspace:
  - packages/unibox_testing
  - packages/unibox_core
  - packages/unibox_flutter
  - packages/unibox_css
  - packages/unibox_html
  - packages/unibox_material
  - example/unibox_example_shared
  - example/unibox_example_flutter
  - example/unibox_example_site
